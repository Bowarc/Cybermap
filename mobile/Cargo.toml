[package]
name = "mobile"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "Cybermap"
path = "src/main.rs"

[dependencies]
dioxus = { workspace = true, features = ["router"] }
ui = { workspace = true }
osm = { workspace = true }
serde_json = "1.0.145"
reqwest = { version = "0.13.1", features = ["json", "query"] }

[features]
default = ["mobile"]
mobile = ["dioxus/mobile"]
