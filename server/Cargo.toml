[package]
name = "server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "cybermap_server"
path = "src/main.rs"

[lib]
name = "cybermap_server_lib"
path = "src/lib.rs"

[dependencies]
reqwest = { workspace = true, features = ["json", "stream", "query"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
warp = { version = "0.4.2", features = ["server"] }
warp-rate-limit = { git = "https://github.com/bowarc/warp-rate-limit" }
logger = { git = "https://github.com/bowarc/crates", package = "logger" }
serde = { workspace = true, features = ["derive"] }
log.workspace = true
time.workspace = true
osm = { path = "../osm" }
serde_json.workspace = true


[dev-dependencies]
warp = { version = "0.4.2", features = ["server", "test"] }
log = "0.4.20"
