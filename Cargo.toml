[workspace]
resolver = "2"
members = ["ui", "web", "mobile", "server", "osm"]

[workspace.dependencies]
dioxus = { version = "0.7.2" }
serde_json = "1.0.148"
reqwest = "0.13.1"
serde = { version = "1.0.228", features = ["rc"] }
time = { git = "https://github.com/bowarc/crates", package = "time" }

# workspace
ui = { path = "ui" }
osm = { path = "osm" }
